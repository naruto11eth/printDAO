version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: printdao-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment to run the bot in Docker
  # bot:
  #   build: .
  #   container_name: printdao-bot
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   env_file:
  #     - .env
  #   environment:
  #     - REDIS_URL=redis://redis:6379/0
  #   restart: unless-stopped

volumes:
  redis_data:
