version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: printdao-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  indexer:
    build: .
    container_name: printdao-indexer
    command: ["python", "run_indexer.py"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

  bot:
    build: .
    container_name: printdao-bot
    command: ["python", "-m", "bot.main"]
    depends_on:
      redis:
        condition: service_healthy
      indexer:
        condition: service_started
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

volumes:
  redis_data:
